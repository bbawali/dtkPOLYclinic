<style>

html,body{height:100%}
body{

button{font-family:inherit}
input,select,textarea{font-family:inherit}

.btn-primary{background:var(--teal);color:#fff;box-shadow:0 6px 16px -6px rgba(15,110,100,.55)}

.btn-outline{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn-outline:hover{background:var(--teal-soft)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--gray-soft)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#a3291d}

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script>
/* ============================================================
   DUTTAPUKUR POLYCLINIC — single-file PWA
   Firebase (compat SDK) + Firestore + Storage + Auth
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyCZcliehQnb0BM-hH1WrGBfpN6NoPFdir8",
  authDomain: "duttapukur-polyclinic.firebaseapp.com",
  projectId: "duttapukur-polyclinic",
  storageBucket: "duttapukur-polyclinic.firebasestorage.app",
  messagingSenderId: "705609180707",
  appId: "1:705609180707:web:d272193117e64110e0b396"
};

firebase.initializeApp(firebaseConfig);
// Secondary app instance: lets Admin create Doctor auth accounts
// without Firebase Auth swapping the Admin's own active session.
const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");

const auth = firebase.auth();
const db = firebase.firestore();
// Single settings() call: sets ignoreUndefinedProperties AND configures
// multi-tab persistent cache in one shot. Calling settings() a second time
// (which enablePersistence() used to do internally) caused the console
// warning "You are overriding the original host." — merged here instead.
try {
  db.settings({
    ignoreUndefinedProperties: true,
    cache: firebase.firestore.persistentLocalCache({
      tabManager: firebase.firestore.persistentMultipleTabManager()
    })
  });
} catch (e) {
  // Fallback for older SDK builds without the persistentLocalCache API.
  db.settings({ ignoreUndefinedProperties: true });
  try { db.enablePersistence({ synchronizeTabs: true }).catch(()=>{}); } catch(e2) {}
}

const FieldValue = firebase.firestore.FieldValue;

/* ---------------- constants ---------------- */
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const DAY_LABEL_BN = {sunday:'রবিবার',monday:'সোমবার',tuesday:'মঙ্গলবার',wednesday:'বুধবার',thursday:'বৃহস্পতিবার',friday:'শুক্রবার',saturday:'শনিবার'};
const DAY_LABEL_SHORT = {sunday:'Sun',monday:'Mon',tuesday:'Tue',wednesday:'Wed',thursday:'Thu',friday:'Fri',saturday:'Sat'};
const STATUS_LABEL = {pending:'Pending',confirmed:'Confirmed',rejected:'Rejected',cancelled:'Cancelled',completed:'Completed',deleted:'Deleted'};
const CLINIC_DEFAULT = {clinicName:'Duttapukur Polyclinic', phone:'', address:'Duttapukur, North 24 Parganas, West Bengal', email:'', openingInfo:'Open all days · Chamber timings vary by doctor'};

/* ---------------- utils ---------------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

function todayIST(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Kolkata'}); // YYYY-MM-DD
}
function nowISTMinutes(){
  const s = new Date().toLocaleTimeString('en-GB', {timeZone:'Asia/Kolkata', hour12:false});
  const [h,m] = s.split(':').map(Number);
  return h*60+m;
}
function dateToDayKey(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  return DAYS[d.getDay()];
}
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.toLocaleDateString('en-CA');
}
function formatDateDisplay(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
}
function formatDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}
function formatTimeDisplay(t){
  if(!t) return '';
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12 ? 'PM':'AM';
  h = h%12; if(h===0) h=12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function timeToMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minutesToTime(mins){ const h=Math.floor(mins/60), m=mins%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function fmtMoney(n){ n = Number(n||0); return '₹' + n.toLocaleString('en-IN'); }
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function generateSlots(startTime, endTime, duration){
  const out = [];
  let m = timeToMinutes(startTime), end = timeToMinutes(endTime);
  duration = Number(duration) || 15;
  while(m + duration <= end){ out.push(minutesToTime(m)); m += duration; }
  return out;
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

// Doctor photos are stored inline in Firestore (no Cloud Storage / billing
// account needed) as a compressed JPEG data URI. Resized + quality-stepped
// down until it comfortably fits well inside Firestore's 1MB document cap.
async function compressImageToDataUri(file, maxDim=480, quality=0.72){
  const rawDataUrl = await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Could not read the image file.'));
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject)=>{
    const im = new Image();
    im.onload = ()=>resolve(im);
    im.onerror = ()=>reject(new Error('That file is not a readable image.'));
    im.src = rawDataUrl;
  });
  let w = img.width, h = img.height;
  if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
  else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h); // flatten transparency (PNG -> JPEG)
  ctx.drawImage(img, 0, 0, w, h);
  let q = quality, out = canvas.toDataURL('image/jpeg', q), tries = 0;
  while(out.length > 700000 && tries < 6){
    q = Math.max(0.25, q - 0.12);
    out = canvas.toDataURL('image/jpeg', q);
    tries++;
  }
  if(out.length > 950000) throw new Error('This photo is too large even after compression. Please choose a smaller or simpler image.');
  return out;
}

/* ---------------- toast ---------------- */
function toast(msg, type='default', ms=3200){
  const host = $('#toastHost');
  const el = document.createElement('div');
  el.className = `toast ${type} anim-in pointer-events-auto`;
  const icon = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-circle-exclamation' : 'fa-circle-info';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(-8px)'; setTimeout(()=>el.remove(), 250); }, ms);
}

/* ---------------- modal ---------------- */
function closeModal(){ $('#modalHost').innerHTML=''; document.body.style.overflow=''; }
function openModal(innerHtml, opts={}){
  document.body.style.overflow='hidden';
  $('#modalHost').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this && ${opts.dismissible!==false}) closeModal()">
      <div class="modal-box modal-pop" onclick="event.stopPropagation()">${innerHtml}</div>
    </div>`;
}
function confirmDialog({icon='fa-circle-question', title, body, confirmText='Confirm', cancelText='Cancel', danger=false, onConfirm}){
  const btnCls = danger ? 'btn-danger' : 'btn-primary';
  window.__confirmCb = onConfirm;
  openModal(`
    <div class="text-center px-1 py-2">
      <div class="w-14 h-14 rounded-full mx-auto mb-3 flex items-center justify-center ${danger?'bg-[var(--red-soft)] text-[var(--red)]':'bg-[var(--teal-soft)] text-[var(--teal)]'}">
        <i class="fa-solid ${icon} text-xl"></i>
      </div>
      <h3 class="font-extrabold text-lg mb-1">${esc(title)}</h3>
      <div class="text-sm text-[var(--ink-soft)] leading-relaxed mb-5">${body}</div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-block" onclick="closeModal()">${esc(cancelText)}</button>
        <button class="btn ${btnCls} btn-block" onclick="window.__confirmCb && window.__confirmCb(); closeModal();">${esc(confirmText)}</button>
      </div>
    </div>`);
}
function loadingOverlay(msg){
  openModal(`<div class="text-center py-6"><span class="spinner spinner-dark" style="width:2em;height:2em;border-width:3px"></span>
    <div class="mt-3 text-sm font-bold text-[var(--ink-soft)]">${esc(msg||'Please wait...')}</div></div>`, {dismissible:false});
}

/* ---------------- status badge ---------------- */
function statusBadge(status){
  const label = STATUS_LABEL[status] || status;
  return `<span class="badge badge-${status}">${esc(label)}</span>`;
}
function emptyState(icon, title, sub){
  return `<div class="text-center py-14 px-6">
    <div class="w-16 h-16 rounded-2xl bg-[var(--gray-soft)] text-[var(--gray)] flex items-center justify-center mx-auto mb-3"><i class="fa-solid ${icon} text-2xl"></i></div>
    <div class="font-extrabold text-[var(--ink)]">${esc(title)}</div>
    ${sub? `<div class="text-sm text-[var(--ink-soft)] mt-1">${esc(sub)}</div>`:''}
  </div>`;
}
function skeletonRows(n=3){
  return Array.from({length:n}).map(()=>`<div class="skeleton h-20 rounded-2xl mb-3"></div>`).join('');
}
/* ---------------- global state ---------------- */
const St = {
  user: null,          // firebase auth user
  role: null,           // 'user' | 'doctor' | 'admin'
  profile: null,        // users/{uid} doc
  doctor: null,         // doctors/{uid} doc (if role doctor)
  view: 'boot',
  viewParams: {},
  unsubs: [],           // active firestore listeners for current view
  cache: {},            // scratch cache keyed by id, for onclick lookups
  clinicSettings: CLINIC_DEFAULT,
};
function clearListeners(){ St.unsubs.forEach(u=>{ try{u();}catch(e){} }); St.unsubs = []; }
function track(unsub){ St.unsubs.push(unsub); return unsub; }

/* ============================================================
   PWA: manifest + service worker + install prompt.

   IMPORTANT: real installability needs a real service-worker FILE —
   the Service Worker spec only allows registering http(s) script URLs,
   not blob: URLs, so a blob-registered worker silently fails in every
   browser and the "Install" prompt never fires. That's why this build
   ships as TWO files: this HTML file + a tiny sw.js next to it. The
   manifest itself is still generated inline (that part is fine as a
   Blob URL — only the service worker script has the http(s)-only rule).
   ============================================================ */
const APP_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f6e64"/><path d="M256 120c-16 0-28 13-28 29v79h-79c-16 0-29 12-29 28s13 29 29 29h79v79c0 16 12 28 28 28s28-12 28-28v-79h79c16 0 29-13 29-29s-13-28-29-28h-79v-79c0-16-12-29-28-29z" fill="#fff"/></svg>`;
function svgToPngDataUri(svgMarkup, size){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgMarkup)));
  });
}
async function setupPWAChrome(){
  const icon192 = await svgToPngDataUri(APP_ICON_SVG, 192).catch(()=>null);
  const icon512 = await svgToPngDataUri(APP_ICON_SVG, 512).catch(()=>null);
  if(icon512) $('#appleTouchIcon').setAttribute('href', icon512);

let adminBootstrapAvailable = false;

async function checkAdminBootstrap(){
  try{
    const snap = await db.collection('system').doc('setup').get();
    adminBootstrapAvailable = !snap.exists || !snap.data().adminCreated;
  }catch(e){ adminBootstrapAvailable = false; }

auth.onAuthStateChanged(async (user)=>{
  clearListeners();
  if(!user){
    St.user = null; St.role = null; St.profile = null; St.doctor = null;
    await checkAdminBootstrap();
    renderRoot();
    return;
  }
  St.user = user;
  try{
    const udoc = await db.collection('users').doc(user.uid).get();
    if(!udoc.exists){
      // Signed in (anonymously, for a patient) but no Firestore profile yet.
      if(user.isAnonymous){ closeModal(); renderCompletePatientProfile(); return; }
      // Staff user with no role doc — treat as an error state and sign out.
      await auth.signOut();
      toast('No profile found for this account. Contact the clinic admin.', 'error');
      return;
    }
    St.profile = udoc.data();
    St.role = St.profile.role;
    if(St.role === 'doctor'){
      const ddoc = await db.collection('doctors').doc(user.uid).get();
      St.doctor = ddoc.exists ? {id:ddoc.id, ...ddoc.data()} : null;
      if(St.doctor && St.doctor.isActive === false){
        await auth.signOut();
        toast('Your account has been deactivated. Contact the clinic admin.', 'error');
        return;
      }
    }
    await loadClinicSettings();
    if(St.role === 'admin') navigate('admin-dashboard');
    else if(St.role === 'doctor') navigate('doctor-dashboard');
    else navigate('user-home');
  }catch(err){
    console.error(err);
    renderRoot();
  }
});

async function loadClinicSettings(){
  try{
    const s = await db.collection('clinicSettings').doc('main').get();
    St.clinicSettings = s.exists ? {...CLINIC_DEFAULT, ...s.data()} : CLINIC_DEFAULT;

}

const Data = {};

function friendlyFireError(err){
  console.error(err);
  const code = err && err.code;
  if(code === 'permission-denied') return 'You are not allowed to do that.';
  if(code === 'failed-precondition' || (err && /index/i.test(err.message||''))) return 'The database is preparing an index for this query — please try again in a minute.';
  if(code === 'unavailable') return 'Connection issue. Check your internet and try again.';
  // A plain (non-Firebase) Error we threw ourselves — e.g. image compression — carries its own clear message.
  if(!code && err instanceof Error && err.message) return err.message;
  return 'Something went wrong. Please try again.';
}

// Priority: Special Date Override -> Weekly Schedule -> No Availability
Data.getDayAvailability = async function(doctorId, dateStr){
  const specialSnap = await db.collection('doctorSchedules').doc(doctorId).collection('specialDates').doc(dateStr).get();
  if(specialSnap.exists){
    const sp = specialSnap.data();
    if(!sp.available) return {available:false, source:'special', note:sp.note||''};
    return {available:true, source:'special', startTime:sp.startTime, endTime:sp.endTime, slotDuration: sp.slotDuration || 15, note: sp.note||''};
  }
  const schedSnap = await db.collection('doctorSchedules').doc(doctorId).get();
  const weekly = schedSnap.exists ? (schedSnap.data().weeklySchedule||{}) : {};
  const dayKey = dateToDayKey(dateStr);
  const day = weekly[dayKey];
  if(!day || !day.available) return {available:false, source:'weekly'};
  return {available:true, source:'weekly', startTime:day.startTime, endTime:day.endTime, slotDuration: day.slotDuration || 15};
};

Data.getBookedTimes = async function(doctorId, dateStr){
  const snap = await db.collection('appointments')
    .where('doctorId','==',doctorId).where('appointmentDate','==',dateStr)
    .where('status','in',['pending','confirmed']).get();
  return new Set(snap.docs.map(d=>d.data().appointmentTime));
};

Data.getAvailableSlots = async function(doctorId, dateStr){
  const day = await Data.getDayAvailability(doctorId, dateStr);
  if(!day.available) return {day, slots:[]};
  let slots = generateSlots(day.startTime, day.endTime, day.slotDuration);
  if(dateStr === todayIST()){
    const nowM = nowISTMinutes();
    slots = slots.filter(s => timeToMinutes(s) > nowM);
  }
  const booked = await Data.getBookedTimes(doctorId, dateStr);
  const withStatus = slots.map(s => ({time:s, taken: booked.has(s)}));
  return {day, slots: withStatus};
};

Data.nextAvailableLabel = async function(doctorId){
  for(let i=0;i<21;i++){
    const d = addDaysStr(todayIST(), i);
    const {slots} = await Data.getAvailableSlots(doctorId, d);
    const free = slots.find(s=>!s.taken);
    if(free) return {date:d, time:free.time};
  }
  return null;
};

// Atomic booking — prevents double booking via a deterministic slot-lock document.
Data.bookAppointment = async function({doctorId, doctorName, doctorSpecialization, consultationFee, appointmentDate, appointmentTime, notes}){
  const slotId = `${doctorId}_${appointmentDate}_${appointmentTime}`;
  const slotRef = db.collection('appointmentSlots').doc(slotId);
  const apptRef = db.collection('appointments').doc();
  await db.runTransaction(async (tx)=>{
    const slotDoc = await tx.get(slotRef);
    if(slotDoc.exists) throw {code:'slot-taken'};
    tx.set(slotRef, {appointmentId: apptRef.id, doctorId, appointmentDate, appointmentTime, createdAt: FieldValue.serverTimestamp()});
    tx.set(apptRef, {
      patientId: St.user.uid, patientName: St.profile.name, patientPhone: St.profile.phone,
      doctorId, doctorName, doctorSpecialization: doctorSpecialization||'',
      appointmentDate, appointmentTime, consultationFee: Number(consultationFee)||0,
      status: 'pending', notes: notes||'',
      requestedAt: FieldValue.serverTimestamp(), confirmedAt:null, rejectedAt:null, completedAt:null, cancelledAt:null, deletedAt:null,
      isDeleted:false, createdAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp()
    });
  });
  return apptRef.id;
};

Data.releaseSlot = async function(doctorId, appointmentDate, appointmentTime){
  const slotId = `${doctorId}_${appointmentDate}_${appointmentTime}`;
  try{ await db.collection('appointmentSlots').doc(slotId).delete(); }catch(e){}
};

Data.setAppointmentStatus = async function(appt, status, extra={}){
  const ref = db.collection('appointments').doc(appt.id);
  const patch = {status, updatedAt: FieldValue.serverTimestamp(), ...extra};
  if(status==='confirmed') patch.confirmedAt = FieldValue.serverTimestamp();
  if(status==='rejected') patch.rejectedAt = FieldValue.serverTimestamp();
  if(status==='cancelled') patch.cancelledAt = FieldValue.serverTimestamp();
  if(status==='completed') patch.completedAt = FieldValue.serverTimestamp();
  await ref.update(patch);
  if(['rejected','cancelled'].includes(status)){
    await Data.releaseSlot(appt.doctorId, appt.appointmentDate, appt.appointmentTime);
  }
};

Data.softDeleteAppointment = async function(appt){
  await db.collection('appointments').doc(appt.id).update({
    isDeleted:true, status:'deleted', deletedAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp()
  });
  await Data.releaseSlot(appt.doctorId, appt.appointmentDate, appt.appointmentTime);
};

// Revenue: CONFIRMED => expected revenue, COMPLETED => earned revenue (Section 20/59 rule)
function splitRevenue(appts){
  let earned=0, expected=0, completedCount=0, confirmedCount=0;
  appts.forEach(a=>{
    if(a.status==='completed'){ earned += Number(a.consultationFee)||0; completedCount++; }
    else if(a.status==='confirmed'){ expected += Number(a.consultationFee)||0; confirmedCount++; }
  });
  return {earned, expected, total: earned+expected, completedCount, confirmedCount};
}
function inRange(dateStr, from, to){ return dateStr >= from && dateStr <= to; }
function weekBounds(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const dow = d.getDay(); // 0=Sun
  const start = addDaysStr(dateStr, -dow);
  const end = addDaysStr(start, 6);
  return [start,end];
}
function monthBounds(dateStr){
  const [y,m] = dateStr.split('-').map(Number);
  const start = `${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return [start,end];
}

function applyDoctorRange(){ renderDoctorApptList(); }
function renderDoctorApptList(){
  const wrap = $('#doctorApptListWrap'); if(!wrap) return;
  const filter = St.viewParams.filter || 'today';
  let list = St.cache.__doctorAppts || [];
  const today = todayIST();
  if(filter==='today') list = list.filter(a=>a.appointmentDate===today);
  else if(filter==='tomorrow') list = list.filter(a=>a.appointmentDate===addDaysStr(today,1));
  else if(filter==='week'){ const [ws,we]=weekBounds(today); list = list.filter(a=>inRange(a.appointmentDate,ws,we)); }
  else if(filter==='upcoming') list = list.filter(a=>a.appointmentDate>=today && ['pending','confirmed'].includes(a.status));
  else if(filter==='completed') list = list.filter(a=>a.status==='completed');
  else if(filter==='rejected') list = list.filter(a=>a.status==='rejected');
  else if(filter==='range'){
    const from = $('#rangeFrom')?.value, to = $('#rangeTo')?.value;
    if(from && to) list = list.filter(a=>inRange(a.appointmentDate, from, to));
  }
  const q = ($('#docApptSearch')?.value||'').trim().toLowerCase();
  if(q) list = list.filter(a=>(a.patientName||'').toLowerCase().includes(q) || (a.patientPhone||'').includes(q));
  list.sort((a,b)=>(a.appointmentDate+a.appointmentTime).localeCompare(b.appointmentDate+b.appointmentTime));
  wrap.innerHTML = list.length ? list.map(doctorApptCard).join('') : emptyState('fa-calendar-xmark','No appointments found');
}

function toggleDayRow(cb){
  const fields = cb.closest('.card').querySelector('.day-fields');
  fields.classList.toggle('hidden', !cb.checked);
  const thumb = cb.closest('label').querySelector('div>div');
  if(thumb) thumb.style.transform = cb.checked ? 'translateX(18px)' : 'translateX(0)';
  const track = cb.closest('label').querySelector('div');
  if(track) track.style.background = cb.checked ? 'var(--teal)' : '';
}
async function saveWeeklySchedule(){
  const weekly = {};
  $$('#weeklyWrap [data-day]').forEach(row=>{
    const day = row.dataset.day;
    const available = row.querySelector('.day-toggle').checked;
    if(available){
      weekly[day] = {
        available:true,
        startTime: row.querySelector('.day-start').value,
        endTime: row.querySelector('.day-end').value,
        slotDuration: Number(row.querySelector('.day-dur').value) || 15
      };
    } else weekly[day] = {available:false};
  });
  for(const day of DAYS){
    if(weekly[day].available && weekly[day].startTime >= weekly[day].endTime){
      toast(`${DAY_LABEL_BN[day]}: End time must be after start time`, 'error'); return;
    }
  }
  try{
    await db.collection('doctorSchedules').doc(St.user.uid).set({weeklySchedule: weekly, updatedAt: FieldValue.serverTimestamp()}, {merge:true});
    toast('Weekly schedule saved','success');
  }catch(err){ toast(friendlyFireError(err),'error'); }
}

async function saveSpecialDate(){

  if(!date){ toast('Select a date','error'); return; }
  const available = $('#sdAvailable').checked;
  const payload = {date, available, note: $('#sdNote').value.trim(), createdAt: FieldValue.serverTimestamp()};
  if(available){
    const st = $('#sdStart').value, en = $('#sdEnd').value;
    if(st >= en){ toast('End time must be after start time','error'); return; }
    payload.startTime = st; payload.endTime = en; payload.slotDuration = 15;
  }
  try{
    await db.collection('doctorSchedules').doc(St.user.uid).collection('specialDates').doc(date).set(payload);
    closeModal();
    toast('Special date saved','success');
  }catch(err){ toast(friendlyFireError(err),'error'); }

  else if(range==='lastweek'){ const [ws] = weekBounds(today); to = addDaysStr(ws,-1); from = addDaysStr(to,-6); }
  else if(range==='month'){ [from,to] = monthBounds(today); }
  else if(range==='lastmonth'){ const [ms] = monthBounds(today); to = addDaysStr(ms,-1); [from] = monthBounds(to); }
  fetchAndRenderDoctorFinance(from, to);
};
function renderFinanceEmpty(){
  $('#financeSummary').innerHTML = emptyState('fa-calendar','Pick a date range','Choose From and To dates, then tap Apply');
  $('#financeTableWrap').innerHTML = '';
}
function loadDoctorFinanceCustom(){
  const from = $('#finFrom').value, to = $('#finTo').value;
  if(!from || !to || from>to){ toast('Select a valid date range','error'); return; }
  fetchAndRenderDoctorFinance(from, to);
}
async function fetchAndRenderDoctorFinance(from, to){
  $('#financeSummary').innerHTML = skeletonRows(1);
  $('#financeTableWrap').innerHTML = skeletonRows(3);
  try{
    const snap = await db.collection('appointments').where('doctorId','==',St.user.uid)
      .where('appointmentDate','>=',from).where('appointmentDate','<=',to).get();
    const list = snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>!a.isDeleted);
    const r = splitRevenue(list);
    $('#financeSummary').innerHTML = `
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Completed (Earned)</div><div class="text-xl font-extrabold text-[var(--green)]">${fmtMoney(r.earned)}</div><div class="text-[10px] text-[var(--ink-soft)]">${r.completedCount} appointment(s)</div></div>
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Confirmed (Expected)</div><div class="text-xl font-extrabold text-[var(--amber)]">${fmtMoney(r.expected)}</div><div class="text-[10px] text-[var(--ink-soft)]">${r.confirmedCount} appointment(s)</div></div>
      </div>
      <div class="stat-card text-center"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Total Revenue</div><div class="text-2xl font-extrabold">${fmtMoney(r.total)}</div></div>`;

    const byDate = {};
    list.filter(a=>['completed','confirmed'].includes(a.status)).forEach(a=>{
      byDate[a.appointmentDate] = byDate[a.appointmentDate] || {count:0, revenue:0};
      byDate[a.appointmentDate].count++; byDate[a.appointmentDate].revenue += Number(a.consultationFee)||0;
    });
    const rows = Object.keys(byDate).sort().reverse();
    $('#financeTableWrap').innerHTML = rows.length ? `
      <table class="data-table"><thead><tr><th>Date</th><th>Appointments</th><th>Revenue</th></tr></thead><tbody>
      ${rows.map(d=>`<tr><td>${formatDateShort(d)}</td><td>${byDate[d].count}</td><td class="font-bold">${fmtMoney(byDate[d].revenue)}</td></tr>`).join('')}
      </tbody></table>` : emptyState('fa-chart-simple','No revenue records found');
  }catch(err){
    $('#financeSummary').innerHTML = emptyState('fa-triangle-exclamation', friendlyFireError(err));
    $('#financeTableWrap').innerHTML = '';
  }
}

function renderAdminApptList(){

  const filter = St.viewParams.filter || 'all';
  let list = St.cache.__adminAppts || [];

  if(filter==='pending') list = list.filter(a=>a.status==='pending');
  else if(filter==='confirmed') list = list.filter(a=>a.status==='confirmed');
  else if(filter==='today') list = list.filter(a=>a.appointmentDate===today);
  else if(filter==='tomorrow') list = list.filter(a=>a.appointmentDate===addDaysStr(today,1));
  else if(filter==='this_week'){ const [ws,we]=weekBounds(today); list = list.filter(a=>inRange(a.appointmentDate,ws,we)); }
  else if(filter==='last_week'){ const [ws]=weekBounds(today); const lwe=addDaysStr(ws,-1), lws=addDaysStr(lwe,-6); list = list.filter(a=>inRange(a.appointmentDate,lws,lwe)); }
  else if(filter==='this_month'){ const [ms,me]=monthBounds(today); list = list.filter(a=>inRange(a.appointmentDate,ms,me)); }
  else if(filter==='last_month'){ const [ms]=monthBounds(today); const lme=addDaysStr(ms,-1); const [lms]=monthBounds(lme); list = list.filter(a=>inRange(a.appointmentDate,lms,lme)); }
  else if(filter==='range'){ const f=$('#aRangeFrom')?.value, t=$('#aRangeTo')?.value; if(f&&t) list = list.filter(a=>inRange(a.appointmentDate,f,t)); }
  const docFilter = $('#aDoctorFilter')?.value;
  if(docFilter) list = list.filter(a=>a.doctorId===docFilter);
  const q = ($('#aApptSearch')?.value||'').trim().toLowerCase();
  if(q) list = list.filter(a=>(a.patientName||'').toLowerCase().includes(q) || (a.patientPhone||'').includes(q) || (a.doctorName||'').toLowerCase().includes(q));
  list.sort((a,b)=>(b.appointmentDate+b.appointmentTime).localeCompare(a.appointmentDate+a.appointmentTime));
  if(cardsWrap) cardsWrap.innerHTML = list.length ? list.map(a=>adminApptCard(a)).join('') : emptyState('fa-calendar-xmark','No appointments found');
  if(tbody) tbody.innerHTML = list.length ? list.map(adminApptRow).join('') : `<tr><td colspan="9">${emptyState('fa-calendar-xmark','No appointments found')}</td></tr>`;
}

  if(q) list = list.filter(d=>(d.name||'').toLowerCase().includes(q) || (d.specialization||'').toLowerCase().includes(q));
  wrap.innerHTML = list.length ? list.map(adminDoctorCard).join('') : emptyState('fa-user-doctor', tab==='active'?'No active doctors':'No inactive doctors');
}
function adminDoctorCard(d){
  const img = d.imageUrl ? `<img src="${esc(d.imageUrl)}" class="w-14 h-14 rounded-2xl object-cover shrink-0" onerror="this.remove()">` : `<div class="avatar w-14 h-14 rounded-2xl shrink-0 text-lg">${initials(d.name)}</div>`;
  return `
  <div class="card p-4 flex items-center gap-3 mb-3">
    ${img}
    <div class="flex-1 min-w-0">
      <div class="font-extrabold truncate">Dr. ${esc(d.name)} ${d.isActive===false?'<span class="badge badge-cancelled ml-1">Inactive</span>':''}</div>
      <div class="text-xs text-[var(--ink-soft)] truncate">${esc(d.degree||'')} ${d.specialization?'· '+esc(d.specialization):''}</div>
      <div class="text-xs font-bold text-[var(--teal-deep)] mt-0.5">${fmtMoney(d.consultationFee)}</div>
    </div>
    <div class="flex flex-col gap-1.5 shrink-0">
      <button class="btn btn-sm btn-outline" onclick="openEditDoctorModal('${d.id}')"><i class="fa-solid fa-pen"></i></button>
      ${d.isActive===false ?
        `<button class="btn btn-sm btn-primary" onclick="toggleDoctorActive('${d.id}',true)">Activate</button>` :
        `<button class="btn btn-sm btn-ghost text-[var(--red)]" onclick="toggleDoctorActive('${d.id}',false)">Deactivate</button>`}
    </div>
  </div>`;
}
function toggleDoctorActive(id, active){
  confirmDialog({icon: active?'fa-circle-check':'fa-ban', title: active?'Activate doctor?':'Deactivate doctor?', danger:!active,
    body: active ? 'This doctor will reappear for new bookings.' : 'This doctor will disappear from new bookings. Existing appointments and finance records are kept.',
    confirmText: active?'Activate':'Deactivate',
    onConfirm: async ()=>{
      try{ await db.collection('doctors').doc(id).update({isActive:active, updatedAt:FieldValue.serverTimestamp()}); toast(active?'Doctor activated':'Doctor deactivated','success'); }
      catch(err){ toast(friendlyFireError(err),'error'); }
    }});
}

      <div><label class="field-label">Specialization</label><input id="fSpec" class="input" value="${esc(d.specialization||'')}" placeholder="Medicine"></div>

      <div><label class="field-label">Consultation Fee (₹)</label><input id="fFee" type="number" min="0" class="input" value="${d.consultationFee||''}"></div>

}

function openAddDoctorModal(){
  openModal(`
    <div class="px-1">
      <h3 class="font-extrabold text-lg mb-4">Add Doctor</h3>
      ${addDoctorFormFields()}
      <div class="h-px bg-[var(--line)] my-4"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="field-label">Login Email *</label><input id="fEmail" type="email" class="input" placeholder="doctor@example.com"></div>
        <div class="col-span-2"><label class="field-label">Temporary Password *</label><input id="fTempPass" class="input" placeholder="Min 6 characters"></div>
      </div>
      <button class="btn btn-primary btn-block mt-5" id="createDocBtn" onclick="createDoctor()">Create Doctor</button>
    </div>`);
}
async function createDoctor(){
  const name = $('#fName').value.trim(), email = $('#fEmail').value.trim(), pass = $('#fTempPass').value;
  if(!name || !email || pass.length < 6){ toast('Doctor name, email and a password (min 6 chars) are required','error'); return; }
  const btn = $('#createDocBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';
  const imageFile = $('#fImage').files[0];
  try{
    // Use the secondary Firebase app so this sign-up does not replace the admin's own session.
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
    const newUid = cred.user.uid;
    await secondaryApp.auth().signOut();

    let imageUrl = '';
    if(imageFile){
      imageUrl = await compressImageToDataUri(imageFile);
    }
    const doctorData = {
      name, degree: $('#fDegree').value.trim(), specialization: $('#fSpec').value.trim(),
      registrationNumber: $('#fReg').value.trim(), registrationPublic: $('#fRegPublic').checked,
      consultationFee: Number($('#fFee').value)||0, phone: $('#fPhone').value.trim(),
      location: $('#fLocation').value.trim(), description: $('#fDesc').value.trim(),
      imageUrl, isActive:true, createdAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp()
    };
    await db.collection('doctors').doc(newUid).set(doctorData);
    await db.collection('users').doc(newUid).set({role:'doctor', name, email, doctorId:newUid, createdAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp()});
    await db.collection('doctorSchedules').doc(newUid).set({weeklySchedule:{}, updatedAt: FieldValue.serverTimestamp()});

    closeModal();
    openModal(`
      <div class="px-1 text-center py-2">
        <div class="w-14 h-14 rounded-full bg-[var(--green-soft)] text-[var(--green)] flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-circle-check text-xl"></i></div>
        <h3 class="font-extrabold text-lg mb-1">Doctor Created Successfully</h3>
        <p class="text-sm text-[var(--ink-soft)] mb-4">Share these login credentials with Dr. ${esc(name)} securely.</p>
        <div class="card p-3 text-left text-sm space-y-1 mb-4">
          <div><b>Email:</b> ${esc(email)}</div>
          <div><b>Temporary Password:</b> ${esc(pass)}</div>
        </div>
        <button class="btn btn-primary btn-block" onclick="closeModal()">Done</button>
      </div>`, {dismissible:false});
  }catch(err){
    console.error(err);
    let msg = friendlyFireError(err);
    if(err.code==='auth/email-already-in-use') msg = 'This email is already registered.';
    toast(msg, 'error');
    btn.disabled = false; btn.innerHTML = 'Create Doctor';
  }
}

function openEditDoctorModal(id){
  const d = St.cache['doc_'+id]; if(!d) return;
  openModal(`
    <div class="px-1">
      <h3 class="font-extrabold text-lg mb-4">Edit Doctor</h3>
      ${addDoctorFormFields(d)}
      <button class="btn btn-primary btn-block mt-5" id="saveDocBtn" onclick="saveEditDoctor('${id}')">Save Changes</button>
      <button class="btn btn-ghost btn-block mt-1" data-email="${esc(d.email||'')}" onclick="resetDoctorPassword(this.dataset.email)"><i class="fa-solid fa-key"></i> Send Password Reset Email</button>
    </div>`);
}
async function saveEditDoctor(id){
  const btn = $('#saveDocBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...';
  try{
    const imageFile = $('#fImage').files[0];
    const patch = {
      name: $('#fName').value.trim(), degree: $('#fDegree').value.trim(), specialization: $('#fSpec').value.trim(),
      registrationNumber: $('#fReg').value.trim(), registrationPublic: $('#fRegPublic').checked,
      consultationFee: Number($('#fFee').value)||0, phone: $('#fPhone').value.trim(),
      location: $('#fLocation').value.trim(), description: $('#fDesc').value.trim(),
      updatedAt: FieldValue.serverTimestamp()
    };
    if(imageFile){
      patch.imageUrl = await compressImageToDataUri(imageFile);
    }
    await db.collection('doctors').doc(id).update(patch);
    await db.collection('users').doc(id).update({name: patch.name, updatedAt: FieldValue.serverTimestamp()}).catch(()=>{});
    closeModal();
    toast('Doctor updated','success');
  }catch(err){ toast(friendlyFireError(err),'error'); btn.disabled=false; btn.innerHTML='Save Changes'; }
}
async function resetDoctorPassword(email){
  if(!email){ toast('No email on file for this doctor','error'); return; }
  try{ await auth.sendPasswordResetEmail(email); toast('Password reset email sent to '+email,'success'); }
  catch(err){ toast(friendlyFireError(err),'error'); }
}

/* ---------------- Admin: Finance / Reports ---------------- */
VIEW_RENDERERS['admin-finance'] = function(params={}){
  const range = params.range || 'month';
  shellStaff('admin', 'admin-finance', 'Finance & Reports', `
    <div class="anim-in">
      <div class="flex gap-2 overflow-x-auto scrollbar-none pb-2 mb-4">
        ${[['today','Today'],['this_week','This Week'],['last_week','Last Week'],['month','This Month'],['last_month','Last Month'],['range','Custom Range']]
          .map(([k,l])=>`<button class="chip ${range===k?'active':''}" onclick="navigate('admin-finance',{range:'${k}'})">${l}</button>`).join('')}
      </div>
      ${range==='range' ? `
      <div class="card p-3 flex flex-wrap gap-2 items-end mb-4">
        <div><label class="field-label">From</label><input type="date" id="afFrom" class="input"></div>
        <div><label class="field-label">To</label><input type="date" id="afTo" class="input"></div>
        <button class="btn btn-primary btn-sm" onclick="loadAdminFinance()">Apply</button>
      </div>`:''}
      <div id="adminFinSummary" class="mb-6">${skeletonRows(1)}</div>
      <div class="font-extrabold text-sm text-[var(--ink-soft)] uppercase tracking-wide mb-2">Revenue &amp; Appointments by Doctor</div>
      <div id="adminFinByDoctor" class="card p-0 overflow-x-auto mb-6">${skeletonRows(3)}</div>
      <div class="font-extrabold text-sm text-[var(--ink-soft)] uppercase tracking-wide mb-2">Revenue by Day</div>
      <div id="adminFinByDay" class="card p-0 overflow-x-auto">${skeletonRows(3)}</div>
    </div>
  `);
  if(range==='range'){ $('#adminFinSummary').innerHTML = emptyState('fa-calendar','Pick a date range','Choose From and To dates, then tap Apply'); $('#adminFinByDoctor').innerHTML=''; $('#adminFinByDay').innerHTML=''; return; }
  const today = todayIST();
  let from,to;
  if(range==='today'){ from=to=today; }
  else if(range==='this_week'){ [from,to]=weekBounds(today); }
  else if(range==='last_week'){ const [ws]=weekBounds(today); to=addDaysStr(ws,-1); from=addDaysStr(to,-6); }
  else if(range==='month'){ [from,to]=monthBounds(today); }
  else if(range==='last_month'){ const [ms]=monthBounds(today); to=addDaysStr(ms,-1); [from]=monthBounds(to); }
  fetchAdminFinance(from,to);
};
function loadAdminFinance(){
  const from=$('#afFrom').value, to=$('#afTo').value;
  if(!from||!to||from>to){ toast('Select a valid date range','error'); return; }
  fetchAdminFinance(from,to);
}
async function fetchAdminFinance(from,to){
  $('#adminFinSummary').innerHTML = skeletonRows(1);
  $('#adminFinByDoctor').innerHTML = skeletonRows(2);
  $('#adminFinByDay').innerHTML = skeletonRows(2);
  try{
    const snap = await db.collection('appointments').where('appointmentDate','>=',from).where('appointmentDate','<=',to).get();
    const list = snap.docs.map(d=>({id:d.id,...d.data()})).filter(a=>!a.isDeleted);
    const r = splitRevenue(list);
    $('#adminFinSummary').innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Total Appointments</div><div class="text-xl font-extrabold">${list.length}</div></div>
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Completed (Earned)</div><div class="text-xl font-extrabold text-[var(--green)]">${fmtMoney(r.earned)}</div></div>
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Confirmed (Expected)</div><div class="text-xl font-extrabold text-[var(--amber)]">${fmtMoney(r.expected)}</div></div>
        <div class="stat-card"><div class="text-[11px] font-bold text-[var(--ink-soft)] mb-1">Total Revenue</div><div class="text-xl font-extrabold">${fmtMoney(r.total)}</div></div>
      </div>`;
    const byDoc = {};
    list.filter(a=>['completed','confirmed'].includes(a.status)).forEach(a=>{
      byDoc[a.doctorId] = byDoc[a.doctorId] || {name:a.doctorName, count:0, revenue:0};
      byDoc[a.doctorId].count++; byDoc[a.doctorId].revenue += Number(a.consultationFee)||0;
    });
    const docRows = Object.values(byDoc).sort((a,b)=>b.revenue-a.revenue);
    $('#adminFinByDoctor').innerHTML = docRows.length ? `
      <table class="data-table"><thead><tr><th>Doctor</th><th>Appointments</th><th>Revenue</th></tr></thead><tbody>
      ${docRows.map(r=>`<tr><td class="font-bold">Dr. ${esc(r.name)}</td><td>${r.count}</td><td class="font-bold">${fmtMoney(r.revenue)}</td></tr>`).join('')}
      </tbody></table>` : emptyState('fa-chart-simple','No revenue records found');

    const byDate = {};
    list.filter(a=>['completed','confirmed'].includes(a.status)).forEach(a=>{
      byDate[a.appointmentDate] = byDate[a.appointmentDate] || {count:0, revenue:0};
      byDate[a.appointmentDate].count++; byDate[a.appointmentDate].revenue += Number(a.consultationFee)||0;
    });
    const dateRows = Object.keys(byDate).sort().reverse();
    $('#adminFinByDay').innerHTML = dateRows.length ? `
      <table class="data-table"><thead><tr><th>Date</th><th>Appointments</th><th>Revenue</th></tr></thead><tbody>
      ${dateRows.map(d=>`<tr><td>${formatDateShort(d)}</td><td>${byDate[d].count}</td><td class="font-bold">${fmtMoney(byDate[d].revenue)}</td></tr>`).join('')}
      </tbody></table>` : emptyState('fa-chart-simple','No revenue records found');
  }catch(err){
    $('#adminFinSummary').innerHTML = emptyState('fa-triangle-exclamation', friendlyFireError(err));
    $('#adminFinByDoctor').innerHTML = ''; $('#adminFinByDay').innerHTML = '';
  }
}

/* ---------------- Admin: Messages ---------------- */
VIEW_RENDERERS['admin-messages'] = function(params={}){
  const activeDoctorId = params.doctorId || null;
  shellStaff('admin', 'admin-messages', 'Doctor Messages', `
    <div class="anim-in grid lg:grid-cols-[280px_1fr] gap-4" style="min-height:60vh">
      <div id="threadListWrap" class="space-y-2">${skeletonRows(4)}</div>
      <div>
        ${activeDoctorId ? `
        <div class="flex flex-col" style="min-height:60vh">
          <div id="adminChatWrap" class="flex-1 mb-3">${skeletonRows(3)}</div>
          <div class="sticky bottom-0 bg-[var(--paper)] pt-2 flex gap-2">
            <input id="adminChatInput" class="input flex-1" placeholder="Reply to doctor..." onkeydown="if(event.key==='Enter') sendAdminMessage('${activeDoctorId}')">
            <button class="btn btn-primary" onclick="sendAdminMessage('${activeDoctorId}')"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>` : `<div class="card hidden lg:flex items-center justify-center" style="min-height:50vh">${emptyState('fa-comments','Select a conversation')}</div>`}
      </div>
    </div>
  `);
  track(db.collection('messages').orderBy('updatedAt','desc').limit(100).onSnapshot(snap=>{
    const wrap = $('#threadListWrap'); if(!wrap) return;
    const list = snap.docs.map(d=>({id:d.id,...d.data()}));
    wrap.innerHTML = list.length ? list.map(m=>`
      <div class="card p-3 flex items-center gap-3 cursor-pointer ${activeDoctorId===m.id?'border-[var(--teal)]':''}" onclick="navigate('admin-messages',{doctorId:'${m.id}'})">
        <div class="avatar w-9 h-9 shrink-0 text-xs">${initials(m.doctorName)}</div>
        <div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">Dr. ${esc(m.doctorName||'')}</div><div class="text-xs text-[var(--ink-soft)] truncate">${esc(m.lastMessage||'')}</div></div>
      </div>`).join('') : emptyState('fa-comments','No conversations yet');
  }, err=> $('#threadListWrap').innerHTML = emptyState('fa-triangle-exclamation', friendlyFireError(err))));

  if(activeDoctorId){
    track(db.collection('messages').doc(activeDoctorId).collection('thread').orderBy('createdAt','asc').limit(200)
      .onSnapshot(snap=>{
        const wrap = $('#adminChatWrap'); if(!wrap) return;
        const list = snap.docs.map(d=>d.data());
        wrap.innerHTML = list.length ? list.map(m=>chatBubble(m, m.sender==='admin')).join('') : emptyState('fa-comments','No messages yet');
        wrap.scrollTop = wrap.scrollHeight;
      }, err=> $('#adminChatWrap').innerHTML = emptyState('fa-triangle-exclamation', friendlyFireError(err))));
  }
};
async function sendAdminMessage(doctorId){
  const input = $('#adminChatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{
    await db.collection('messages').doc(doctorId).collection('thread').add({sender:'admin', text, createdAt: FieldValue.serverTimestamp(), readByAdmin:true, readByDoctor:false});
    await db.collection('messages').doc(doctorId).set({lastMessage:text, lastSender:'admin', updatedAt: FieldValue.serverTimestamp()}, {merge:true});
  }catch(err){ toast(friendlyFireError(err),'error'); input.value = text; }
}
